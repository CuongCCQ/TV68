name: Build APK
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'release/**' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          { grep -niE "error|exception|what went wrong|failed" -A6 build.log | head -c 3200; echo; tail -c 1500 build.log; } > err.txt || true
          python3 -c "import sys;t=open('err.txt').read().replace('%','%25').replace('','').replace('
','%0A');print('::error::'+t)"
      - uses: actions/upload-artifact@v4
        with:
          name: TVHome-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to release/ folder
        run: |
          mkdir -p release && cp app/build/outputs/apk/release/app-release.apk release/TVHome.apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add release/TVHome.apk
          git diff --cached --quiet || (git commit -m "Update TVHome.apk [skip ci]" && git push)
