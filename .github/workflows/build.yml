name: Build APK
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'release/**' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TVHome-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to release/ folder
        run: |
          mkdir -p release && cp app/build/outputs/apk/release/app-release.apk release/TVHome.apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add release/TVHome.apk
          git diff --cached --quiet || (git commit -m "Update TVHome.apk [skip ci]" && git push)
