name: Build APK
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'release/**' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -nE "error:|e: |What went wrong|Execution failed|AAPT|resource .* not found" -A4 build.log | head -c 3500 | sed 's/%/%25/g; s/\r/%0D/g' | tr '\n' '\r' | sed 's/\r/%0A/g' | xargs -0 printf "::error::%s\n"
      - uses: actions/upload-artifact@v4
        with:
          name: TVHome-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to release/ folder
        run: |
          mkdir -p release && cp app/build/outputs/apk/release/app-release.apk release/TVHome.apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add release/TVHome.apk
          git diff --cached --quiet || (git commit -m "Update TVHome.apk [skip ci]" && git push)
