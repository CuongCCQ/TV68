name: Build APK
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'release/**' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      # Keep one debug signing key across builds, so each new APK installs over the previous one.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: python3 .github/report.py
      - uses: actions/upload-artifact@v4
        with:
          name: TVHome-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to release/ folder
        run: |
          mkdir -p release && cp app/build/outputs/apk/release/app-release.apk release/TVHome.apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add release/TVHome.apk
          git diff --cached --quiet || (git commit -m "Update TVHome.apk [skip ci]" && git push)
